<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Security</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#050505;
    color:#00ff66;
    font-family:monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}
.box{
    width:100%;
    max-width:520px;
    border:1px solid #00ff66;
    padding:25px;
    box-shadow:0 0 25px #00ff6633;
}
h1{
    color:#ff3333;
    text-align:center;
    font-size:25px;
}
#device{
    color:white;
    text-align:center;
    margin-bottom:25px;
}
.bar{
    height:18px;
    border:1px solid #00ff66;
    margin-top:10px;
}
#progress{
    height:100%;
    width:0%;
    background:#00ff66;
}
#log{
    margin-top:20px;
    min-height:150px;
    white-space:pre-line;
}
.warning{
    color:#ff3333;
    font-size:20px;
    text-align:center;
    display:none;
}
button{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#111;
    border:1px solid #00ff66;
    color:#00ff66;
    font-family:monospace;
    font-size:16px;
}
</style>
</head>

<body>

<div class="box">

<h1>⚠️ SECURITY CENTER</h1>

<div id="device">Detectando dispositivo...</div>

<div class="bar">
<div id="progress"></div>
</div>

<div id="log"></div>

<div id="warning">
⚠️ ACCESO NO AUTORIZADO ⚠️
</div>

<button id="exit">CERRAR</button>

</div>

<script>

const device = document.getElementById("device");
const progress = document.getElementById("progress");
const log = document.getElementById("log");
const warning = document.getElementById("warning");
const exit = document.getElementById("exit");

const ua = navigator.userAgent;

if(/iPhone|iPad|iPod/i.test(ua)){
    device.textContent = "DISPOSITIVO DETECTADO: iPHONE / iOS";
}else if(/Android/i.test(ua)){
    device.textContent = "DISPOSITIVO DETECTADO: ANDROID";
}else{
    device.textContent = "DISPOSITIVO DETECTADO: SMARTPHONE";
}

const messages=[
    "Inicializando diagnóstico...",
    "Analizando memoria...",
    "Comprobando conexiones...",
    "Analizando aplicaciones...",
    "Buscando actividad sospechosa...",
    "Verificando sistema...",
    "Finalizando análisis..."
];

let p=0;
let i=0;

function scan(){

    if(i < messages.length){

        log.textContent += "> " + messages[i] + "\n";

        i++;

        p += Math.floor(Math.random()*15)+10;

        if(p>100)p=100;

        progress.style.width=p+"%";

        setTimeout(scan,900);

    }else{

        setTimeout(()=>{

            warning.style.display="block";

            log.textContent +=
            "\n> ANÁLISIS COMPLETADO\n"+
            "> RESULTADO: SOSPECHOSO\n";

            setTimeout(()=>{

                warning.innerHTML =
                "😂 ERA UNA BROMA 😂<br><br>"+
                "<span style='color:#00ff66;font-size:15px'>"+
                "Tu teléfono está completamente bien."
                +"</span>";

            },2500);

        },700);

    }
}

exit.onclick=()=>{
    document.body.innerHTML=
    "<div style='color:#00ff66;font-family:monospace;text-align:center;margin-top:40vh;font-size:20px'>"+
    "Sistema cerrado.<br><br>😂 Todo era una broma."
    +"</div>";
};

scan();

</script>

</body>
</html>
